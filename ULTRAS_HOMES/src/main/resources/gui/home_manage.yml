# واجهة إدارة هوم واحدة مملوكة للاعب نفسه (تظهر عند الضغط على Dye أخضر في homes.yml)
title: "<gradient:#8B0000:#FF5555>ULTRAS HOMES</gradient> <dark_gray>| <gray>Manage {home}"
rows: 3

background:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  exclude-slots: [11, 13, 15]

info:
  slot: 13
  material: PAPER
  name: "<white>{home}"
  lore:
    - "<gray>World: <white>{world}"
    - "<gray>Coordinates: <white>{x}, {y}, {z}"
    - "<gray>Created: <white>{created_at}"

teleport:
  slot: 11
  material: ENDER_PEARL
  name: "<green><bold>Teleport</bold>"
  lore: ["<gray>Teleport to this home"]
  sound: BLOCK_NOTE_BLOCK_XYLOPHONE

delete:
  slot: 15
  material: RED_DYE
  name: "<red><bold>Delete</bold>"
  lore: ["<gray>Permanently delete this home", "<dark_red>This cannot be undone"]
  sound: ENTITY_ITEM_BREAK
  # هل يطلب تأكيدًا ثانيًا (ضغطة ثانية خلال 5 ثواني) قبل الحذف الفعلي؟
  confirm: true

back:
  slot: 22
  material: ARROW
  name: "<yellow>« Back</yellow>"
  lore: []
  sound: UI_BUTTON_CLICK
