# واجهة قائمة الهومات الخاصة باللاعب (أو التي يراها الإداري عبر player_homes.yml بدلًا من هذا الملف)
title: "<gradient:#8B0000:#FF5555>ULTRAS HOMES</gradient> <dark_gray>| <gray>Page {page}"
rows: 4
# عدد سلوتات الهوم الظاهرة في كل صفحة (Bed أعلى / Dye أسفلها)
homes-per-page: 7
# أرقام سلوتات الـ Bed (الصف الثاني) - غيّرها كما تريد بدون لمس الجافا
bed-slots: [10, 11, 12, 13, 14, 15, 16]
# أرقام سلوتات الـ Dye (الصف الثالث، تحت كل Bed مباشرة)
dye-slots: [19, 20, 21, 22, 23, 24, 25]

background:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  # كل السلوتات غير المذكورة صراحة تُملأ بهذا العنصر
  exclude-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 30, 32, 34]

navigation:
  previous:
    slot: 30
    material: ARROW
    name: "<yellow>« Previous Page"
    lore: ["<gray>Go to page {page}"]
    sound: UI_BUTTON_CLICK
  next:
    slot: 34
    material: ARROW
    name: "<yellow>Next Page »"
    lore: ["<gray>Go to page {page}"]
    sound: UI_BUTTON_CLICK
  close:
    slot: 32
    material: BARRIER
    name: "<red><bold>Close</bold>"
    lore: []
    sound: UI_BUTTON_CLICK

home:
  available:
    bed:
      material: GRAY_BED
      name: "<gray>Home #{home_number}"
      lore:
        - "<gray>Status: <white>Available"
        - ""
        - "<dark_gray>Click the dye below to save"
    dye:
      material: GRAY_DYE
      name: "<gray>Save Home #{home_number}"
      lore: ["<yellow>Click to save your current location"]
      sound: BLOCK_NOTE_BLOCK_PLING
  saved:
    bed:
      material: GREEN_BED
      name: "<green>{home}"
      lore:
        - "<gray>World: <white>{world}"
        - "<gray>Coordinates: <white>{x}, {y}, {z}"
        - ""
        - "<yellow>Click to teleport"
      sound: BLOCK_NOTE_BLOCK_XYLOPHONE
    dye:
      material: GREEN_DYE
      name: "<green>Manage {home}"
      lore: ["<yellow>Click to manage this home"]
      sound: UI_BUTTON_CLICK
  locked:
    bed:
      material: BLACK_BED
      name: "<dark_gray>Locked"
      lore: ["<gray>Requires a higher home limit"]
    dye:
      material: BLACK_DYE
      name: "<dark_gray>Locked"
      lore: ["<gray>Required limit: <white>{required_limit}"]
      sound: ENTITY_VILLAGER_NO

save-success-sound: ENTITY_EXPERIENCE_ORB_PICKUP
open-sound: BLOCK_CHEST_OPEN
