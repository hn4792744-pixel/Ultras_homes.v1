# ======================================================================
#  ULTRAS_HOMES  -  by UC_Hussein   (Paper 1.21+)
# ======================================================================

# اللغة الافتراضية للرسائل: en أو ar
# يمكن تغييرها في أي وقت ثم تنفيذ /home_admin reload
language:
  default: "en"

# بادئة كل رسالة في الشات (MiniMessage). القيمة الافتراضية متدرجة من أحمر غامق إلى أحمر فاتح.
prefix: "<gradient:#8B0000:#FF5555><bold>ULTRAS MC</bold></gradient> <dark_gray>|</dark_gray> <gray>"

# ---------------------------------------------------------------- التخزين
storage:
  # كم ثانية بين كل حفظ تلقائي دوري للاعبين الموجودين في الذاكرة والذين تغيّرت بياناتهم (dirty)
  save-interval-seconds: 60
  # بعد خروج اللاعب: يُحفظ ملفه فورًا، لكن نبقيه في الكاش هذه المدة قبل إزالته نهائيًا
  # (يفيد إذا نفّذ إداري أمرًا عليه بعد خروجه مباشرة، فلا نضطر لإعادة القراءة من القرص)
  unload-delay-seconds: 30

# ---------------------------------------------------------------- الهومات
homes:
  # عدد الهومات الافتراضي لأي لاعب ليس لديه صلاحية ultras.homes.limit.<رقم> ولا حد مخصص من الإداري
  default-limit: 4
  # أقصى عدد هومات ممكن على الإطلاق (لا يمكن لأي إداري أو صلاحية تجاوزه)
  maximum: 50
  # صيغة اسم الهوم التلقائي. {number} يُستبدل برقم السلوت (1، 2، 3 ...)
  name-format: "home{number}"
  confirmation:
    # هل يطلب /home rest تأكيدًا قبل حذف كل الهومات؟
    reset-requires-confirmation: true
    # مدة صلاحية زر [Confirm] بالثواني قبل انتهاء المهلة
    confirmation-timeout-seconds: 30
  # اسم الأمر الفرعي المستخدم لحذف كل الهومات: rest أو reset
  reset-subcommand: "rest"

# ---------------------------------------------------------------- النقل (Teleport)
teleport:
  # مدة العد التنازلي بالثواني قبل تنفيذ النقل الفعلي
  delay: 3
  # مدة الانتظار بالثواني بعد نجاح النقل قبل أن يستطيع اللاعب استخدام هوم آخر
  cooldown: 10
  # هل تلغي حركة اللاعب عملية النقل أثناء العد التنازلي؟
  cancel-on-move: true
  # أقصى مسافة (بالبلوك) يمكن أن يتحرك بها اللاعب قبل اعتبارها "حركة ملغية للنقل"
  move-tolerance: 0.35
  arrival-protection:
    # تفعيل حماية اللاعب من الضرر لثوانٍ بعد وصوله للهوم
    enabled: true
    # مدة الحماية بالثواني
    duration: 2
  sounds:
    enabled: true
    # صوت يتكرر كل ثانية أثناء العد التنازلي
    countdown: BLOCK_NOTE_BLOCK_HAT
    # صوت عند نجاح النقل
    success: ENTITY_ENDERMAN_TELEPORT
    # صوت عند إلغاء النقل (حركة/موت/خروج)
    cancelled: ENTITY_VILLAGER_NO
    # صوت عند حدوث خطأ (مكان غير صالح مثلًا)
    error: ENTITY_VILLAGER_NO

# ---------------------------------------------------------------- صلاحيات الإداري
admin:
  # هل يتجاوز الإداري صاحب صلاحية ultras.homes.bypass.cooldown فترة الانتظار؟
  bypass-cooldown: true
  # سلوك /home_admin set عندما يكون الحد الجديد أقل من عدد الهومات الحالية للاعب:
  # KEEP = تبقى الهومات الزائدة محفوظة لكن غير قابلة للاستخدام حتى يُرفع الحد أو تُحذف يدويًا
  # DELETE_EXCESS = حذف الهومات الزائدة عن الحد الجديد فورًا (لا رجعة)
  set-limit-behavior: "KEEP"
  # هل يحذف /home_admin rest الهومات نفسها أيضًا، أم يعيد الحد فقط إلى الافتراضي؟
  reset-homes-too: false

# ---------------------------------------------------------------- حظر العوالم
world-blacklist:
  # تفعيل حظر نظام الهومات بالكامل في عوالم معينة
  enabled: false
  # أسماء العوالم الممنوعة (لا /home ولا /homes ولا /sethome ولا Teleport إليها)
  worlds:
    - "world_the_end"

# ---------------------------------------------------------------- عرض معلومات اللاعب (واجهة الإداري)
player-info:
  enabled: true
  show-world: true
  show-coordinates: true
  show-online-status: true

# ---------------------------------------------------------------- السجلات
logging:
  enabled: true
  log-home-create: true
  log-home-delete: true
  log-home-teleport: true
  log-admin-actions: true
  # سجل تفصيلي لعمليات تحميل/حفظ الملفات (Debug) - اتركه false في الإنتاج
  log-data: false
